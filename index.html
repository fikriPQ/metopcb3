/* E-Maintenance Fasad. Tema "beton dan rambu": abu beton, tinta gelap, biru baja untuk tindakan petugas,
   oranye keselamatan hanya untuk melapor dan menandai kerusakan. Tanpa pustaka luar agar berjalan tanpa internet. */
:root{
  --bg:#EEF1F0; --surface:#fff; --ink:#17212B; --muted:#5A6672; --line:#D7DDDF; --soft:#F5F7F7;
  --accent:#1F5F8B; --accent-ink:#fff; --accent-soft:#E3EEF6; --accent-dark:#174A6D;
  --lapor:#C8470B; --lapor-dark:#A93B08; --lapor-soft:#FDEBDD; --lapor-terang:#F07A2E;
  --side:#17212B; --side-2:#1F2C38; --side-3:#2A3B4B; --side-ink:#C9D3DB; --side-muted:#8A98A5;
  --baik:#2E7D4F; --baik-soft:#DCEFE3; --waspada:#8A5F00; --waspada-soft:#FBF0CF;
  --perhatian:#B4581A; --perhatian-soft:#F9E3D3; --kritis:#B3261E; --kritis-soft:#F8DCDA;
  --netral:#5D6B73; --netral-soft:#E6EAEC;
  --radius:10px; --radius-kecil:6px;
  --bayang:0 1px 2px rgba(23,33,43,.06), 0 4px 14px rgba(23,33,43,.05);
  --font:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:Bahnschrift, "DIN Alternate", "DIN 2014", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-dark)}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.005em}
h1{font-size:28px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
img{max-width:100%}
::selection{background:#F9D3B8}

/* ------------------------------------------------------------ kerangka aplikasi petugas */
.kerangka{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.samping{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:16px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.samping .merek{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:600;font-size:16px;color:#fff;padding:2px 8px 10px;border-bottom:1px solid var(--side-3)}
.samping .merek small{display:block;font-family:var(--font);font-weight:400;font-size:12px;color:var(--side-muted);margin-top:1px}
.logo{flex:none;display:block}
.samping nav{display:flex;flex-direction:column;gap:1px}
.samping .grup{font-size:12px;font-weight:600;color:var(--side-muted);padding:14px 10px 4px}
.samping a{color:var(--side-ink);text-decoration:none;padding:7px 10px;border-radius:var(--radius-kecil);font-size:14px;border-left:3px solid transparent}
.samping a:hover{background:var(--side-2);color:#fff}
.samping a.aktif{background:var(--side-3);color:#fff;border-left-color:var(--lapor-terang);font-weight:600}
.samping .pengguna{margin-top:auto;font-size:13px;padding:12px 8px 0;color:var(--side-ink);border-top:1px solid var(--side-3);display:flex;flex-direction:column;gap:6px}
.samping .pengguna .siapa{display:flex;gap:10px;align-items:center}
.samping .pengguna .inisial{flex:none;width:32px;height:32px;border-radius:50%;background:var(--side-3);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:600}
.samping .pengguna .kecil{color:var(--side-muted)}
.samping .pengguna a{padding:0;border:0;color:var(--side-ink);text-decoration:underline}
.samping .pengguna a:hover{background:none}
.samping .pengguna .tombol.kedua{background:transparent;color:var(--side-ink);border-color:var(--side-3);width:100%;justify-content:center}
.samping .pengguna .tombol.kedua:hover{background:var(--side-2);color:#fff}
.isi{padding:28px 36px 56px;display:flex;flex-direction:column;gap:22px;min-width:0;max-width:1320px}

.kepala{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.kepala p{color:var(--muted);max-width:72ch}
.kartu{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--bayang)}
a.kartu{transition:border-color .15s}
a.kartu:hover{border-color:var(--accent)}
.kisi{display:grid;gap:16px}
.kisi-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kisi-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kisi-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.angka-besar{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.redup{color:var(--muted)} .kecil{font-size:13px}

/* kartu angka dasbor: garis atas menunjukkan sifat angkanya */
.statistik{border-top:3px solid var(--line);gap:6px}
.statistik.st-waspada{border-top-color:#C99A06}
.statistik.st-lapor{border-top-color:var(--lapor-terang)}
.statistik.st-aksen{border-top-color:var(--accent)}

/* ------------------------------------------------------------ tabel */
.tabel-bungkus{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);background:var(--soft);font-weight:600;border-bottom-color:var(--line)}
tbody tr:hover td{background:#FAFBFB}
td.angka,th.angka{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* ------------------------------------------------------------ tombol */
.tombol{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  padding:9px 16px;border-radius:var(--radius-kecil);font:600 14px var(--font);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.tombol:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.tombol.kedua{background:var(--surface);color:var(--accent);border-color:#B9CCDB}
.tombol.kedua:hover{background:var(--accent-soft);color:var(--accent-dark)}
.tombol.lapor{background:var(--lapor);border-color:var(--lapor)}
.tombol.lapor:hover{background:var(--lapor-dark);border-color:var(--lapor-dark)}
.tombol.bahaya{background:var(--surface);color:var(--kritis);border-color:#E5B4B0}
.tombol.bahaya:hover{background:var(--kritis-soft)}
.tombol.kecil{padding:5px 10px;font-size:13px}
.tombol.besar{padding:13px 22px;font-size:16px}
.tombol svg{flex:none}
.tombol:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #F0A06B;outline-offset:2px}
.baris-tombol{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.sebaris{display:inline}

/* ------------------------------------------------------------ isian */
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],input[type=tel],select,textarea{
  width:100%;padding:9px 11px;border:1px solid #C5CED2;border-radius:var(--radius-kecil);font:15px var(--font);background:#fff;color:var(--ink);transition:border-color .15s, box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#9FAEB6}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input[type=file]{font:14px var(--font);padding:10px;border:1.5px dashed #B9C4C9;border-radius:var(--radius-kecil);background:var(--soft);width:100%;cursor:pointer}
input[type=file]:hover{border-color:var(--accent)}
input[type=file]::file-selector-button{font:600 13px var(--font);border:1px solid var(--accent);background:#fff;color:var(--accent);padding:6px 12px;border-radius:5px;margin-right:12px;cursor:pointer}
textarea{min-height:96px;resize:vertical}
.isian{display:flex;flex-direction:column;gap:2px}
.isian .bantu{font-size:13px;color:var(--muted)}
.isian .galat{font-size:13px;color:var(--kritis)}
.formulir{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.formulir .penuh{grid-column:1/-1}
.cek{display:flex;gap:8px;align-items:center;font-weight:500}
.cek input{width:18px;height:18px;accent-color:var(--accent)}
.saring{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.saring .isian{min-width:180px}

/* ------------------------------------------------------------ pesan dan lencana */
.pesan{padding:12px 14px 12px 16px;border-radius:var(--radius-kecil);font-size:14px;border-left:4px solid}
.pesan.ok{background:var(--baik-soft);color:#1E5236;border-color:var(--baik)}
.pesan.galat{background:var(--kritis-soft);color:#7D1A14;border-color:var(--kritis)}
.pesan ul{margin:4px 0 0 18px;padding:0}
.lencana{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--netral-soft);color:var(--netral)}
.lencana.baik{background:var(--baik-soft);color:var(--baik)}
.lencana.waspada{background:var(--waspada-soft);color:var(--waspada)}
.lencana.perhatian{background:var(--perhatian-soft);color:var(--perhatian)}
.lencana.kritis{background:var(--kritis-soft);color:var(--kritis)}
.lencana.aksen{background:var(--accent-soft);color:var(--accent)}
.status-baru{background:var(--waspada-soft);color:var(--waspada)}
.status-diverifikasi{background:var(--accent-soft);color:var(--accent)}
.status-ditangani,.status-dikerjakan,.status-ditugaskan{background:var(--perhatian-soft);color:var(--perhatian)}
.status-selesai{background:var(--baik-soft);color:var(--baik)}
.status-ditolak,.status-dibatalkan{background:var(--netral-soft);color:var(--netral)}

/* ------------------------------------------------------------ indeks, batang, keluaran */
.indeks{display:flex;align-items:baseline;gap:10px}
.indeks .nilai{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.batang{height:8px;border-radius:4px;background:var(--netral-soft);overflow:hidden}
.batang span{display:block;height:100%;background:var(--accent);border-radius:4px}
.batang.baik span{background:var(--baik)} .batang.waspada span{background:#C99A06}
.batang.perhatian span{background:var(--perhatian)} .batang.kritis span{background:var(--kritis)}
.keluaran{border-top:4px solid var(--accent)}
.keluaran h2 small{display:block;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:2px}
dl.ringkas{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0;font-size:14px}
dl.ringkas dt{color:var(--muted)} dl.ringkas dd{margin:0}
ol.langkah{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.galeri{display:flex;gap:10px;flex-wrap:wrap}
.galeri a{display:block;width:150px;height:110px;border-radius:var(--radius-kecil);overflow:hidden;border:1px solid var(--line)}
.galeri img{width:100%;height:100%;object-fit:cover}
.kosong{padding:28px 22px;text-align:center;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:var(--radius-kecil)}
.peringatan{background:var(--waspada-soft);color:#5C4100;padding:11px 14px;border-radius:var(--radius-kecil);font-size:14px;border-left:4px solid #C99A06}
ul.pagination{list-style:none;display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;justify-content:flex-end}
ul.pagination li>a,ul.pagination li>span{display:inline-block;min-width:34px;text-align:center;padding:5px 10px;border:1px solid var(--line);border-radius:var(--radius-kecil);background:#fff;font-size:13px;text-decoration:none}
ul.pagination li.active>span{background:var(--accent);color:#fff;border-color:var(--accent)}
ul.pagination li.disabled>span{color:var(--muted)}

/* ------------------------------------------------------------ notifikasi dan linimasa */
.samping a.lonceng{display:flex;align-items:center;gap:8px;background:var(--side-2);border:1px solid var(--side-3);border-left-width:1px}
.samping a.lonceng.aktif{border-color:var(--lapor-terang)}
.samping a.lonceng .jumlah{margin-left:auto;background:var(--lapor-terang);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.daftar-notif{list-style:none;margin:0;padding:0}
.daftar-notif li{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.daftar-notif li:last-child{border-bottom:0}
.daftar-notif li.belum{background:var(--accent-soft);border-radius:var(--radius-kecil);padding:12px 10px}
.daftar-notif .isi-notif{flex:1;min-width:0}
.daftar-notif .waktu{white-space:nowrap}
.linimasa{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.linimasa li{position:relative}
.linimasa li::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
details summary{cursor:pointer}
.kode{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.uraian-panjang{max-width:560px}

/* kalimat penyemangat di dasbor */
.penyemangat{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lapor-terang);border-radius:var(--radius);padding:14px 18px;color:var(--ink);box-shadow:var(--bayang)}
.penyemangat svg{flex:none;color:var(--lapor)}
.penyemangat div{display:flex;flex-direction:column;gap:2px}
.penyemangat strong{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.35}
.penyemangat .kecil{color:var(--muted)}

/* ------------------------------------------------------------ halaman publik */
.publik-atas{background:var(--side);color:#fff;position:sticky;top:0;z-index:10}
.publik-dalam{max-width:1140px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.merek-publik{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:17px;color:#fff;text-decoration:none}
.merek-publik:hover{color:#fff}
.merek-publik small{display:block;font-family:var(--font);font-weight:400;font-size:12px;color:var(--side-muted)}
.publik-atas nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.publik-atas nav a{color:var(--side-ink);text-decoration:none;padding:8px 12px;border-radius:var(--radius-kecil);font-size:14px}
.publik-atas nav a:hover{background:var(--side-2);color:#fff}
.publik-atas nav a.aktif{color:#fff;box-shadow:inset 0 -2px 0 var(--lapor-terang);border-radius:0}
.publik-atas nav a.masuk-petugas{border:1px solid var(--side-3);margin-left:6px}
.publik-atas nav a.masuk-petugas:hover{border-color:var(--side-muted)}
.publik-isi{max-width:1140px;margin:0 auto;padding:32px 24px 64px;width:100%}

/* pahlawan: tampak gedung dengan panel rusak */
.pahlawan{background:var(--side);color:#fff;overflow:hidden;position:relative}
.pahlawan::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.pahlawan-dalam{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:56px 24px 0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:end}
.pahlawan-teks{padding-bottom:64px;display:flex;flex-direction:column;gap:18px}
.pahlawan h1{font-size:clamp(32px,4.6vw,52px);line-height:1.05;font-weight:600;letter-spacing:-.015em;max-width:15ch}
.pahlawan-teks > p{font-size:17px;color:var(--side-ink);max-width:48ch}
.pahlawan .baris-tombol{gap:12px;margin-top:6px}
.pahlawan .tombol.kedua{background:transparent;color:#fff;border-color:#4A5D6E}
.pahlawan .tombol.kedua:hover{background:var(--side-2);border-color:var(--side-muted)}
.janji{display:flex;flex-wrap:wrap;gap:8px 22px;margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--side-ink)}
.janji li{display:flex;align-items:center;gap:8px}
.janji svg{color:var(--lapor-terang);flex:none}
.gambar-gedung{display:block;width:100%;height:auto;max-height:440px}
.gambar-gedung .penanda{animation:denyut 2.4s ease-out 0.6s 3}
@keyframes denyut{0%{opacity:1;transform:scale(1)}50%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.gambar-gedung .penanda{animation:none}}

/* langkah melapor */
.alur{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0;padding:0;list-style:none;counter-reset:alur;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--bayang)}
.alur li{padding:20px 22px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 14px;counter-increment:alur}
.alur li + li{border-left:1px solid var(--line)}
.alur li::before{content:counter(alur);grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--lapor-soft);color:var(--lapor);
  display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:18px}
.alur strong{font-family:var(--display);font-size:16px;font-weight:600}
.alur span{font-size:14px;color:var(--muted)}
.publik-alur{margin-top:-28px;position:relative;z-index:2}

/* formulir lapor publik */
.lapor-tata{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.lapor-tata .kartu{padding:26px 28px}
.judul-kartu{display:flex;flex-direction:column;gap:4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.judul-kartu p{color:var(--muted);font-size:14px}
.samping-lapor{display:flex;flex-direction:column;gap:16px;position:sticky;top:86px}
.darurat{background:var(--lapor-soft);border:1px solid #F4C3A0;border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#5E2504}
.darurat strong{font-family:var(--display);font-size:16px;color:var(--lapor-dark);display:flex;gap:8px;align-items:center}
.catatan-kecil{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.catatan-kecil h3{font-size:15px}
.catatan-kecil ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.bagian-isian{font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);margin:6px 0 -4px}

/* lacak status */
.lacak{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.lacak li{position:relative;padding-top:26px;font-size:13px;color:var(--muted);text-align:center}
.lacak li::before{content:"";position:absolute;top:6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2px solid var(--line);z-index:1}
.lacak li::after{content:"";position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--line)}
.lacak li:first-child::after{display:none}
.lacak li.lewat{color:var(--ink)}
.lacak li.lewat::before{background:var(--accent);border-color:var(--accent)}
.lacak li.lewat::after{background:var(--accent)}
.lacak li.kini{color:var(--ink);font-weight:600}
.lacak li.kini::before{background:var(--lapor);border-color:var(--lapor);box-shadow:0 0 0 4px var(--lapor-soft)}

.kaki-publik{background:var(--side);color:var(--side-ink);margin-top:24px}
.kaki-isi{display:grid !important;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:28px;align-items:start;padding:36px 24px !important}
.kaki-merek{display:flex;flex-direction:column;gap:10px;max-width:42ch}
.kaki-merek p{font-size:14px;color:var(--side-muted)}
.merek-kaki{font-size:16px}
.kontak{display:flex;flex-direction:column;gap:4px}
.kontak-label{font-size:13px;color:var(--side-muted);font-weight:600}
.kontak-telepon{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums;width:max-content}
.kontak-telepon svg{color:var(--lapor-terang);flex:none}
.kontak-telepon:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--lapor-terang);text-underline-offset:5px}
.kontak-catatan{font-size:13px;color:var(--side-muted);max-width:34ch}
.kaki-tautan{display:flex;flex-direction:column;gap:6px;font-size:14px}
.kaki-tautan a{color:var(--side-ink);text-decoration:none}
.kaki-tautan a:hover{color:#fff;text-decoration:underline}

/* ------------------------------------------------------------ halaman masuk */
.masuk-bungkus{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,520px)}
.masuk-panel{background:var(--side);color:#fff;padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.masuk-panel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.masuk-panel > *{position:relative;z-index:1}
.masuk-panel h2{font-size:clamp(26px,3vw,38px);line-height:1.1;max-width:16ch}
.masuk-panel p{color:var(--side-ink);max-width:44ch}
.masuk-panel .gambar-gedung{max-width:420px;max-height:300px}
.masuk-sisi{display:grid;place-items:center;padding:32px 24px;background:var(--bg)}
.masuk-kartu{width:100%;max-width:400px}
.masuk-kartu h1{font-size:26px}

/* pilihan peran di halaman masuk */
.pilih-peran{border:0;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pilih-peran legend{font-weight:600;font-size:14px;margin-bottom:6px;padding:0}
.pilih-peran label{margin:0;cursor:pointer;font-weight:400}
.pilih-peran input{position:absolute;opacity:0;pointer-events:none}
.pilih-peran span{display:flex;flex-direction:column;gap:2px;border:1px solid #C5CED2;border-radius:var(--radius-kecil);padding:11px 13px;background:#fff;transition:border-color .15s, background .15s}
.pilih-peran span:hover{border-color:#9FAEB6}
.pilih-peran small{color:var(--muted);font-size:12.5px}
.pilih-peran input:checked + span{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.pilih-peran input:focus-visible + span{outline:3px solid #F0A06B;outline-offset:2px}

/* ------------------------------------------------------------ layar kecil */
@media (max-width: 980px){
  .pahlawan-dalam{grid-template-columns:1fr;padding-top:40px}
  .pahlawan-teks{padding-bottom:8px}
  .gambar-gedung{max-height:280px}
  .lapor-tata{grid-template-columns:1fr}
  .samping-lapor{position:static}
  .masuk-bungkus{grid-template-columns:1fr}
  .masuk-panel{padding:28px 24px}
  .masuk-panel .gambar-gedung,.masuk-panel .tambahan{display:none}
}
@media (max-width: 900px){
  .kerangka{grid-template-columns:1fr}
  .samping{position:static;height:auto}
  .samping nav{flex-direction:row;flex-wrap:wrap}
  .samping .grup{display:none}
  .isi{padding:20px 16px 40px}
  .kisi-2,.kisi-3,.kisi-4,.formulir{grid-template-columns:1fr}
  .alur{grid-template-columns:1fr}
  .alur li + li{border-left:0;border-top:1px solid var(--line)}
  .publik-alur{margin-top:20px}
  .publik-isi{padding:20px 16px 48px}
}
@media (max-width: 560px){
  .lacak{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}
  .lacak li:nth-child(3)::after{display:none}
  .publik-atas nav a{padding:6px 8px;font-size:13px}
}
@media print{
  .samping,.publik-atas,.pahlawan,.kaki-publik{display:none}
  .kerangka{display:block}
  body{background:#fff}
  .kartu{box-shadow:none}
}

/* ------------------------------------------------------------ lembar kerja data master (mirip Excel) */
.lembar-bungkus{display:flex;flex-direction:column;gap:10px;min-width:0}
.lembar-gulir{overflow:auto;max-height:calc(100vh - 260px);min-height:180px;background:#fff;border:1px solid #BFC8CC;border-radius:var(--radius-kecil);box-shadow:var(--bayang)}
table.lembar{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13.5px}
table.lembar th,table.lembar td{padding:0;border:0;border-right:1px solid #DDE2E4;border-bottom:1px solid #DDE2E4;vertical-align:middle;background:#fff}
table.lembar thead th{position:sticky;top:0;z-index:3;background:#EEF1F2;color:#33404B;font-size:12.5px;font-weight:600;padding:8px 10px;white-space:nowrap;border-bottom:1px solid #BFC8CC;text-align:left}
table.lembar .no{position:sticky;left:0;z-index:2;width:44px;min-width:44px;text-align:center;background:#EEF1F2;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;border-right:1px solid #BFC8CC}
table.lembar thead .no{z-index:4}
table.lembar tbody tr:hover td{background:#fff}
table.lembar tbody tr:hover td.no{background:#E3E8EA}
table.lembar .wajib{color:var(--lapor);margin-left:3px}
table.lembar td input,table.lembar td select,table.lembar td textarea{
  width:100%;height:34px;border:0;border-radius:0;background:transparent;padding:6px 9px;font:13.5px var(--font);color:var(--ink);box-shadow:none;display:block}
table.lembar td input:hover,table.lembar td select:hover,table.lembar td textarea:hover{background:#F7F9FA}
table.lembar td input:focus,table.lembar td select:focus,table.lembar td textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent);background:#fff;position:relative;z-index:1}
table.lembar td input[type=checkbox]{width:18px;height:18px;margin:0 auto;accent-color:var(--accent);cursor:pointer}
table.lembar td input[type=checkbox]:focus{box-shadow:none;outline:2px solid var(--accent);outline-offset:2px}

let detak = null;
function pasangJam() {
  clearTimeout(detak);
  const w = document.getElementById('jam-waktu'), t = document.getElementById('jam-tanggal');
  if (!w) return;
  const zona = {timeZone: 'Asia/Jakarta'};
  const fJam = new Intl.DateTimeFormat('id-ID', Object.assign({hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false}, zona));
  const fTgl = new Intl.DateTimeFormat('id-ID', Object.assign({weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}, zona));
  (function jalan() {
    if (!document.body.contains(w)) return;
    const kini = new Date();
    w.innerHTML = fJam.format(kini).replace(/:/g, '.') + ' <small>WIB</small>';
    t.textContent = fTgl.format(kini);
    detak = setTimeout(jalan, 1000 - kini.getMilliseconds());
  })();
}
function penyemangat(u) {
  const daftar = SEMANGAT.concat(SEMANGAT_PERAN[u.peran] || []);
  const kini = new Date(), jam = kini.getHours();
  const blok = Math.floor(kini.getTime() / 7200000); // berganti setiap 2 jam
  const salam = jam >= 4 && jam < 11 ? 'pagi' : jam >= 11 && jam < 15 ? 'siang' : jam >= 15 && jam < 18 ? 'sore' : 'malam';
  return `<div class="penyemangat" role="note"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a1 1 0 0 1 1 1v1.06A8 8 0 0 1 19.94 11H21a1 1 0 1 1 0 2h-1.06A8 8 0 0 1 13 19.94V21a1 1 0 1 1-2 0v-1.06A8 8 0 0 1 4.06 13H3a1 1 0 1 1 0-2h1.06A8 8 0 0 1 11 4.06V3a1 1 0 0 1 1-1Zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
    <div><span class="kecil">Selamat ${salam}, ${esc(u.nama)}.</span><strong>${esc(daftar[blok % daftar.length])}</strong></div></div>`;
}

function pasangIsian() {
  const $ = id => document.getElementById(id);
  const gedung = $('gedung_id'), elevasi = $('elevasi_id'), komponen = $('komponen_id'), jenis = $('jenis_kerusakan_id');
  const satuan = $('satuan-volume'), tanda = $('tanda-visual'), satuanLain = $('satuan_lain');
  const kKomp = $('isian-komponen-lain'), kJenis = $('isian-jenis-lain');
  const sisi = $('sisi-pilih'), petak = $('tampak-petak'), judul = $('tampak-judul'), ditandai = $('ditandai');
  const lantai = $('lantai'), lokasi = $('lokasi_detail'), tambahan = $('lokasi_tambahan'), galat = $('galat-lokasi');
  let bagian = '';
  const tampil = (kotak, ya) => { kotak.hidden = !ya; kotak.querySelectorAll('input,select').forEach(el => { el.required = ya; el.disabled = !ya; }); };
  const daftarJenis = k => KATALOG.jenis.filter(j => j.k === k);
  function ubahKomponen() {
    const lain = komponen.value === 'lain';
    tampil(kKomp, lain);
    jenis.innerHTML = '';
    const d = daftarJenis(komponen.value);
    jenis.add(new Option(komponen.value ? 'Pilih jenis kerusakan' : 'Pilih komponen dulu', ''));
    d.forEach(j => jenis.add(new Option(j.nama, j.kode)));
    if (komponen.value) jenis.add(new Option('Lainnya, tulis sendiri…', 'lain'));
    if (lain) jenis.value = 'lain';
    ubahJenis();
  }
  function ubahJenis() {
    const lain = jenis.value === 'lain';
    tampil(kJenis, lain);
    const j = JENIS[jenis.value];
    satuan.textContent = lain ? (satuanLain.value ? '(' + satuanLain.value + ')' : '') : (j ? '(' + j.satuan + ')' : '');
    tanda.textContent = !lain && j && j.tanda ? 'Tanda: ' + j.tanda : '';
  }
  const namaSisi = () => elevasi.value ? ELV[elevasi.value].nama : '';
  function susun() {
    lokasi.value = (bagian ? 'Bagian ' + bagian : '') + (bagian && tambahan.value.trim() ? '; ' : '') + tambahan.value.trim();
    const s = namaSisi();
    judul.textContent = s ? 'Tampak ' + s : 'Tampak depan sisi fasad';
    const b = [];
    if (lantai.value) b.push(/atap/i.test(lantai.value) ? 'atap' : 'lantai ' + lantai.value);
    if (bagian) b.push('bagian ' + bagian);
    if (s) b.push(s);
    ditandai.textContent = b.length ? 'Ditandai: ' + b.join(', ') + '.' : 'Belum ada posisi yang ditandai.';
    ditandai.classList.toggle('ada', !!(lantai.value && bagian));
    petak.querySelectorAll('button').forEach(x => { const p = x.dataset.lantai === lantai.value && x.dataset.bagian === bagian; x.classList.toggle('pilih', p); x.setAttribute('aria-pressed', p); });
    sisi.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.id === elevasi.value));
  }
  function segarkan() {
    const g = GED[gedung.value];
    elevasi.value = ''; sisi.innerHTML = '';
    if (!g) sisi.innerHTML = '<span class="redup kecil">Pilih gedung dulu.</span>';
    else g.elevasi.forEach(e => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sisi-tombol'; b.dataset.id = e.id; b.textContent = e.nama;
      b.addEventListener('click', () => { elevasi.value = e.id; galat.hidden = true; susun(); });
      sisi.appendChild(b);
    });
    petak.innerHTML = '';
    const n = g ? g.lantai : 4;
    if (lantai.value && !/atap/i.test(lantai.value) && +lantai.value > n) lantai.value = '';
    ['Atap'].concat(Array.from({length: n}, (_, i) => String(n - i))).forEach(lt => {
      const lb = document.createElement('span'); lb.className = 'tampak-lantai'; lb.textContent = lt; petak.appendChild(lb);
      ['kiri', 'tengah', 'kanan'].forEach(bg => {
        const b = document.createElement('button');
        b.type = 'button'; b.dataset.lantai = lt; b.dataset.bagian = bg; b.className = lt === 'Atap' ? 'atap' : '';
        b.setAttribute('aria-label', (lt === 'Atap' ? 'Atap' : 'Lantai ' + lt) + ', bagian ' + bg);
        b.addEventListener('click', () => { const sama = lantai.value === lt && bagian === bg; lantai.value = sama ? '' : lt; bagian = sama ? '' : bg; susun(); });
        petak.appendChild(b);
      });
    });
    susun();
  }
  gedung.addEventListener('change', segarkan);
  komponen.addEventListener('change', ubahKomponen);
  jenis.addEventListener('change', ubahJenis);
  satuanLain.addEventListener('change', ubahJenis);
  tambahan.addEventListener('input', susun);
  segarkan(); ubahKomponen();
}

/* ------------------------------------------------------------------ dasbor */
function tanggap() {
  const batas = Date.now() - 90 * 864e5, h = {};
  ['diverifikasi', 'ditangani', 'selesai'].forEach(s => {
    const n = db.laporan.filter(l => new Date(l.dibuat) >= batas).map(l => {
      const r = db.riwayat.find(x => x.lap === l.id && x.objek === 'laporan' && x.baru === s);
      return r ? jamAntara(l.dibuat, r.waktu) : null;
    }).filter(x => x !== null);
    h[s] = {rata: n.length ? n.reduce((a, b) => a + b, 0) / n.length : null, n: n.length};
  });
  return h;
}
function urutPrioritas(a, b) { return (b.segera - a.segera) || (b.skor - a.skor) || (new Date(b.dibuat) - new Date(a.dibuat)); }
function halamanDasbor(u) {
  const menunggu = db.laporan.filter(l => l.status === 'baru').length;
  const aktif = db.laporan.filter(l => ['diverifikasi', 'ditangani'].includes(l.status)).length;
  const berjalan = db.pk.filter(p => ['ditugaskan', 'dikerjakan'].includes(p.status)).length;
  const t = tanggap();
  const antrean = db.laporan.filter(l => ['baru', 'diverifikasi', 'ditangani'].includes(l.status)).sort(urutPrioritas).slice(0, 10);
  const isi = `${penyemangat(u)}
  <div class="kepala"><div><h1>Kondisi fasad dan antrean penanganan</h1><p>Indeks kondisi dihitung dari laporan yang sudah diverifikasi dan belum selesai ditangani.</p></div>
    <div class="baris-tombol"><a class="tombol lapor" href="#/lapor">Laporkan kerusakan</a><a class="tombol kedua" href="#/cetak">${ikonCetak}Cetak rekap</a></div></div>
  <div class="kisi kisi-3">
    <a class="kartu statistik st-waspada" href="#/laporan?status=baru" style="text-decoration:none;color:inherit"><span class="redup kecil">Menunggu verifikasi</span><span class="angka-besar">${menunggu}</span></a>
    <div class="kartu statistik st-lapor"><span class="redup kecil">Kerusakan aktif dalam indeks</span><span class="angka-besar">${aktif}</span></div>
    <a class="kartu statistik st-aksen" href="#/perintah" style="text-decoration:none;color:inherit"><span class="redup kecil">Perintah kerja berjalan</span><span class="angka-besar">${berjalan}</span></a></div>
  <section class="kartu"><div class="kepala"><h2>Waktu tanggap 90 hari terakhir</h2></div><div class="kisi kisi-3">
    ${[['diverifikasi', 'Laporan masuk sampai diverifikasi'], ['ditangani', 'Laporan masuk sampai perintah kerja'], ['selesai', 'Laporan masuk sampai selesai diperbaiki']].map(([k, label]) =>
      `<div><span class="redup kecil">${label}</span><br><span class="angka-besar">${t[k].rata !== null ? angka(t[k].rata, 1) : '-'}</span> <span class="redup">jam</span><br><span class="redup kecil">rata-rata dari ${t[k].n} laporan</span></div>`).join('')}</div></section>
  <section class="kisi kisi-2">${GEDUNG.map(kartuGedung).join('')}</section>
  <section class="kartu"><div class="kepala"><h2>Antrean penanganan menurut prioritas</h2><a href="#/laporan" class="kecil">Semua laporan</a></div>
    ${antrean.length ? `<div class="tabel-bungkus"><table><thead><tr><th>Laporan</th><th>Kerusakan</th><th>Lokasi</th><th>Tingkat</th><th class="angka">Skor prioritas</th><th class="angka">Estimasi biaya</th><th>Status</th></tr></thead><tbody>
      ${antrean.map(l => `<tr><td><a href="#/laporan/${l.id}">${l.kode}</a>${l.segera ? ' <span class="lencana kritis">Segera</span>' : ''}</td><td>${esc(jenisDari(l).kode + ' ' + jenisDari(l).nama)}</td><td>${esc(GED[l.gedung].nama + ', ' + ELV[l.elevasi].nama)}</td><td>${TINGKAT[l.tingkat].nama}</td><td class="angka">${angka(l.skor)}</td><td class="angka">${rupiah(l.estimasi)}</td><td>${lencanaStatus(l.status, ST_LAP[l.status])}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="kosong">Tidak ada laporan yang menunggu penanganan.</div>'}</section>
  <section class="kartu"><div class="kepala"><h2>Data dan cadangan</h2><button class="tombol kedua kecil" data-aksi-klik="segarkan">Muat ulang data</button></div>
    <p class="redup kecil">Semua laporan, perintah kerja, riwayat, dan akun tersimpan di Google Sheets; foto tersimpan di folder Google Drive pemilik server. Spreadsheet dapat diunduh sebagai Excel untuk analisis penelitian.</p>

}

      ${Object.keys(ST_LAP).map(k => `<a href="${tautan({status: k})}" class="${statusAktif === k ? 'aktif' : ''}"><span class="titik-status status-${k}" aria-hidden="true"></span>${k === 'baru' ? 'Baru' : ST_LAP[k]} <span class="hitung">${jumlah[k]}</span></a>`).join('')}</nav>
    <form class="saring saring-ringkas" data-aksi="saring">

      <div class="isian"><label for="f-gedung" class="kecil">Gedung</label><select id="f-gedung" name="gedung"><option value="">Semua gedung</option>${GEDUNG.map(g => `<option value="${g.id}" ${q.gedung === g.id ? 'selected' : ''}>${esc(g.nama)}</option>`).join('')}</select></div>

      <div class="isian"><label for="f-urut" class="kecil">Urutan</label><select id="f-urut" name="urut"><option value="">Prioritas</option><option value="terbaru" ${q.urut === 'terbaru' ? 'selected' : ''}>Terbaru</option></select></div>

          <option value="semua">Seluruh laporan (${db.laporan.length})</option></select></div>

        <button class="tombol bahaya">Bersihkan</button></div>

    <div class="info-daftar redup kecil">${daftar.length ? `Menampilkan ${daftar.length} laporan${ket}${q.cari ? ' untuk pencarian "' + esc(q.cari) + '"' : ''}.` : ''}</div>
    ${daftar.length ? `<div class="tabel-bungkus"><table class="tabel-laporan"><thead><tr><th class="kol-pilih"><input type="checkbox" id="pilih-semua" aria-label="Pilih semua laporan"></th><th>Laporan</th><th>Kerusakan</th><th>Lokasi</th><th>Tingkat</th><th class="angka">Skor</th><th class="angka">Estimasi biaya</th><th>Petugas</th><th>Status</th></tr></thead><tbody>
      ${daftar.map(l => { const pk = pkDari(l), j = jenisDari(l); return `<tr class="${l.segera && ['baru', 'diverifikasi', 'ditangani'].includes(l.status) ? 'baris-segera' : ''}">
        <td class="kol-pilih"><input type="checkbox" class="pilih-laporan" value="${l.id}" aria-label="Pilih laporan ${l.kode}"></td>

        <td>${esc(GED[l.gedung].nama)}<br><span class="redup kecil">${esc(lokasiTeks(l))}${l.lokasi ? ', ' + esc(l.lokasi.toLowerCase().slice(0, 30)) : ''}</span></td>

function pasangBersihkan() {
  const buka = document.getElementById('buka-bersihkan'), form = document.getElementById('form-bersihkan');
  const daftar = document.getElementById('daftar-laporan'), cakupan = document.getElementById('cakupan');
  const semua = document.getElementById('pilih-semua'), info = document.getElementById('info-pilih');
  const kotak = () => [...document.querySelectorAll('.pilih-laporan')];
  const jml = {ditolak: db.laporan.filter(l => l.status === 'ditolak').length, selesai: db.laporan.filter(l => l.status === 'selesai').length, semua: db.laporan.length};
  function segarkan() {
    const k = kotak(), n = k.filter(c => c.checked).length, mode = cakupan.value;
    cakupan.options[0].textContent = 'Laporan yang dicentang di tabel (' + n + ')';
    daftar.classList.toggle('mode-pilih', !form.hidden && mode === 'terpilih');
    if (semua) { semua.checked = k.length > 0 && n === k.length; semua.indeterminate = n > 0 && n < k.length; }
    k.forEach(c => c.closest('tr').classList.toggle('baris-dipilih', c.checked && mode === 'terpilih'));
    info.textContent = mode === 'terpilih' ? (n ? n + ' laporan dicentang.' : 'Centang laporan pada tabel di bawah. Kotak di judul kolom memilih semua laporan di tabel ini.') : jml[mode] + ' laporan akan dihapus, termasuk yang tidak tampil di tabel ini.';
  }
  buka.addEventListener('click', () => { form.hidden = !form.hidden; buka.setAttribute('aria-expanded', !form.hidden); if (form.hidden) kotak().forEach(c => c.checked = false); segarkan(); });
  if (semua) semua.addEventListener('change', () => { kotak().forEach(c => c.checked = semua.checked); segarkan(); });
  kotak().forEach(c => c.addEventListener('change', segarkan));
  cakupan.addEventListener('change', segarkan);
  segarkan();
}

const opsiTeknisi = pilih => '<option value="">Belum ditentukan</option>' + PENGGUNA.filter(p => p.peran === 'teknisi' && (p.aktif || p.u === pilih)).map(p => `<option value="${p.u}" ${pilih === p.u ? 'selected' : ''}>${esc(p.nama)}</option>`).join('');

function halamanRincian(id, u) {

function pasangRupiah() {
  document.querySelectorAll('input[data-rupiah]').forEach(el => {
    const rapikan = () => {
      const a = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
      const dariKanan = el.value.length - (el.selectionEnd ?? el.value.length);
      el.value = a ? a.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
      const pos = Math.max(0, el.value.length - dariKanan);
      if (document.activeElement === el) el.setSelectionRange(pos, pos);
    };
    el.addEventListener('input', rapikan);
  });
}

    <div class="isian"><label for="p-sandi">Kata sandi awal</label><input id="p-sandi" name="sandi" type="text" required minlength="8" autocomplete="new-password"><span class="bantu">Paling sedikit 8 karakter. Sampaikan kepada pemilik akun dan minta ia menggantinya.</span></div>
  </div><div id="galat-form" class="pesan galat" hidden></div><div><button class="tombol">Tambah akun</button></div></form>`;
  return halamanApp('Pengguna', isi, 'pengguna');
}

/* ------------------------------------------------------------------ cetak */
function halamanCetak(q, u) {
  const kelola = u.peran === 'pengelola';
  const jenis = kelola ? (q.jenis || 'laporan') : 'teknisi';
  const kini = new Date(), awalBulan = isoHari(new Date(kini.getFullYear(), kini.getMonth(), 1));
  const dari = q.dari || (jenis === 'laporan' && !q.dari ? '2020-01-01' : awalBulan), sampai = q.sampai || isoHari(kini);
  const dalam = iso => { const h = isoHari(new Date(iso)); return h >= dari && h <= sampai; };
  let isiCetak;
  if (jenis === 'laporan') {
    const d = db.laporan.filter(l => dalam(l.dibuat) && (!q.status || l.status === q.status) && (!q.gedung || l.gedung === q.gedung)).sort((a, b) => new Date(a.dibuat) - new Date(b.dibuat));
    isiCetak = `<h2>Rekap laporan kerusakan fasad</h2><p class="kecil">Periode ${tgl(dari)} sampai ${tgl(sampai)}${q.status ? ', status ' + ST_LAP[q.status].toLowerCase() : ''}${q.gedung ? ', ' + GED[q.gedung].nama : ''}. Jumlah ${d.length} laporan, estimasi biaya ${rupiah(d.reduce((s, l) => s + (l.estimasi || 0), 0))}.</p>
      <div class="tabel-bungkus"><table><thead><tr><th>No</th><th>Kode</th><th>Tanggal</th><th>Kerusakan</th><th>Lokasi</th><th>Tingkat</th><th class="angka">Volume</th><th class="angka">Estimasi biaya</th><th>Teknisi</th><th>Status</th></tr></thead><tbody>
      ${d.map((l, i) => { const pk = pkDari(l), j = jenisDari(l); return `<tr><td>${i + 1}</td><td>${l.kode}</td><td>${tgl(l.dibuat)}</td><td>${esc(j.kode + ' ' + j.nama)}</td><td>${esc(lokasiTeks(l, true))}</td><td>${TINGKAT[l.tingkat].nama}</td><td class="angka">${angka(l.volume)} ${esc(j.satuan)}</td><td class="angka">${rupiah(l.estimasi)}</td><td>${pk && pk.teknisi ? esc(USR[pk.teknisi].nama) : '-'}</td><td>${ST_LAP[l.status]}</td></tr>`; }).join('') || '<tr><td colspan="10" class="kosong">Tidak ada laporan pada periode ini.</td></tr>'}</tbody></table></div>`;
  } else {
    const tek = kelola ? (q.teknisi || '') : u.u;
    const daftarTek = PENGGUNA.filter(p => p.peran === 'teknisi' && (!tek || p.u === tek));
    isiCetak = daftarTek.map(t => {
      const d = db.pk.filter(p => p.teknisi === t.u && dalam(p.dibuat));
      return `<h2>Pekerjaan perbaikan: ${esc(t.nama)}</h2><p class="kecil">Periode ${tgl(dari)} sampai ${tgl(sampai)}. ${d.length} perintah kerja, ${d.filter(p => p.status === 'selesai').length} selesai, biaya aktual ${rupiah(d.reduce((s, p) => s + (p.biaya || 0), 0))}.</p>
      <div class="tabel-bungkus"><table><thead><tr><th>No</th><th>Perintah kerja</th><th>Kerusakan</th><th>Lokasi</th><th>Target</th><th>Selesai</th><th class="angka">Estimasi</th><th class="angka">Biaya aktual</th><th>Status</th></tr></thead><tbody>
      ${d.map((p, i) => { const l = lap(p.lap), j = jenisDari(l); return `<tr><td>${i + 1}</td><td>${p.kode}<br><span class="redup kecil">${l.kode}</span></td><td>${esc(j.nama)}</td><td>${esc(lokasiTeks(l, true))}</td><td>${p.target ? tgl(p.target) : '-'}</td><td>${tgl(p.selesai)}</td><td class="angka">${rupiah(l.estimasi)}</td><td class="angka">${rupiah(p.biaya)}</td><td>${ST_PK[p.status]}</td></tr>`; }).join('') || '<tr><td colspan="9" class="kosong">Tidak ada pekerjaan pada periode ini.</td></tr>'}</tbody></table></div>`;
    }).join('');
  }
  const isi = `<div class="kepala tidak-cetak"><div><h1>${kelola ? 'Cetak rekap laporan' : 'Cetak pekerjaan saya'}</h1><p>Atur periode lalu tekan Cetak. Gunakan "Simpan sebagai PDF" di jendela cetak untuk membuat berkas PDF.</p></div>
    <div class="baris-tombol"><button class="tombol" data-aksi-klik="cetak">${ikonCetak}Cetak</button></div></div>
  <form class="kartu saring tidak-cetak" data-aksi="saring-cetak">
    ${kelola ? `<div class="isian"><label for="c-jenis" class="kecil">Jenis rekap</label><select id="c-jenis" name="jenis"><option value="laporan" ${jenis === 'laporan' ? 'selected' : ''}>Rekap laporan kerusakan</option><option value="teknisi" ${jenis === 'teknisi' ? 'selected' : ''}>Pekerjaan per teknisi</option></select></div>` : ''}
    <div class="isian"><label for="c-dari" class="kecil">Dari</label><input id="c-dari" type="date" name="dari" value="${dari}"></div>
    <div class="isian"><label for="c-sampai" class="kecil">Sampai</label><input id="c-sampai" type="date" name="sampai" value="${sampai}"></div>
    ${kelola && jenis === 'teknisi' ? `<div class="isian"><label for="c-tek" class="kecil">Teknisi</label><select id="c-tek" name="teknisi"><option value="">Semua teknisi</option>${PENGGUNA.filter(p => p.peran === 'teknisi').map(p => `<option value="${p.u}" ${q.teknisi === p.u ? 'selected' : ''}>${esc(p.nama)}</option>`).join('')}</select></div>` : ''}
    ${kelola && jenis === 'laporan' ? `<div class="isian"><label for="c-status" class="kecil">Status</label><select id="c-status" name="status"><option value="">Semua status</option>${Object.entries(ST_LAP).map(([k, v]) => `<option value="${k}" ${q.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>` : ''}
    <button class="tombol kedua">Tampilkan</button></form>
  <section class="kartu lembar-cetak"><div class="kop-cetak">${merek(40)}<div class="kecil redup">Dicetak ${tgl(new Date().toISOString(), true)} oleh ${esc(u.nama)}</div></div>${isiCetak}</section>`;
  return halamanApp('Cetak rekap', isi, 'cetak');
}

/* ------------------------------------------------------------------ aksi formulir */
function kecilkanFoto(berkas, sisi = 1280) {
  return Promise.all([...berkas].slice(0, 3).map(f => new Promise(res => {
    if (!f.type.startsWith('image/')) return res(null);
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, sisi / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.75));
    }; img.onerror = () => res(null); img.src = r.result; };
    r.readAsDataURL(f);
  }))).then(a => a.filter(Boolean));
}
function galatForm(f, teks) { const g = f.querySelector('[id=galat-form]'); if (g) { g.textContent = teks; g.hidden = false; g.scrollIntoView({block: 'center', behavior: 'smooth'}); } else alert(teks); }
const angkaDesimal = s => { const t = String(s || '').trim().replace(/\s/g, ''); if (!t) return NaN; return Number(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t); };

function sibuk(el, ya, teks) {
  const b = el && (el.tagName === 'BUTTON' ? el : el.querySelector('button.tombol:not([type=button]), button:not([type])'));
  if (!b) return;
  if (ya) { b.dataset.teks = b.textContent; b.disabled = true; b.textContent = teks || 'Menyimpan…'; }
  else { b.disabled = false; if (b.dataset.teks) b.textContent = b.dataset.teks; }
}
async function jalankan(el, kerja, teks) {
  sibuk(el, true, teks);
  try { await kerja(); }
  catch (e) {
    sibuk(el, false);
    if (e.sesi) return ke('#/masuk', e.message, 'galat');
    if (el && el.tagName === 'FORM') galatForm(el, e.message); else alert(e.message);
  }
}
async function selesaiAksi(hash, teks) { await muatData(); db.waktu = Date.now(); ke(hash, teks); }

const AKSI = {
  lapor(f, d) {
    const salah = [];
    if (!d.get('gedung')) salah.push('Pilih gedung.');
    if (!d.get('elevasi')) { salah.push('Pilih sisi gedung yang rusak.'); document.getElementById('galat-lokasi').hidden = false; }
    const komp = d.get('komponen'), jenis = d.get('jenis');
    if (!komp) salah.push('Pilih komponen yang rusak.');
    if (komp === 'lain' && !(d.get('komponen_lain') || '').trim()) salah.push('Tulis nama komponen.');
    if (!jenis) salah.push('Pilih jenis kerusakan.');
    if (jenis === 'lain' && (!(d.get('jenis_lain') || '').trim() || !d.get('satuan_lain'))) salah.push('Tulis jenis kerusakan dan pilih satuan volumenya.');
    if (!d.get('tingkat')) salah.push('Pilih tingkat kerusakan.');
    const vol = angkaDesimal(d.get('volume'));
    if (!(vol > 0)) salah.push('Isi volume kerusakan dengan angka lebih dari 0.');
    const berkas = f.querySelector('#foto').files;
    if (!sesi.get() && !berkas.length) salah.push('Lampirkan minimal satu foto kerusakan.');
    if (salah.length) return galatForm(f, salah.join(' '));
    return jalankan(f, async () => {
      const foto = await kecilkanFoto(berkas);
      const rapi = t => { t = String(t || '').trim().replace(/\s+/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1); };
      const laporan = {gedung: d.get('gedung'), elevasi: d.get('elevasi'), lantai: d.get('lantai') || '', lokasi: d.get('lokasi') || '',
        tingkat: d.get('tingkat'), volume: vol, deskripsi: (d.get('deskripsi') || '').trim(), pelapor_nama: d.get('nama') || '', pelapor_kontak: d.get('kontak') || ''};
      if (jenis === 'lain') laporan.usulan = {komponen: komp === 'lain' ? '' : komp, namaKomponen: komp === 'lain' ? rapi(d.get('komponen_lain')) : KOMP[komp].nama, nama: rapi(d.get('jenis_lain')), satuan: d.get('satuan_lain')};
      else laporan.jenis = jenis;
      const r = await api('lapor', {laporan, foto, situs: d.get('situs') || ''});
      if (!sesi.get()) { saya.tambah(r.kode); delete cekCache[r.kode]; ke('#/cek?kode=' + r.kode, 'Laporan terkirim dengan kode ' + r.kode + '. Simpan kode ini untuk mengecek statusnya.'); }
      else await selesaiAksi('#/laporan/' + r.id, 'Laporan ' + r.kode + ' tersimpan.');
    }, berkas.length ? 'Mengunggah foto…' : 'Mengirim…');
  },
  cek(f, d) { const k = (d.get('kode') || '').trim().toUpperCase(); delete cekCache[k]; ke('#/cek?kode=' + encodeURIComponent(k)); },
  masuk(f, d) {
    return jalankan(f, async () => {
      const r = await api('masuk', {username: d.get('username'), password: d.get('password')});
      sesi.set(r.token, r.user); db = null;
      ke('#/dasbor', 'Selamat datang, ' + r.user.nama + '.');
    }, 'Memeriksa…');
  },
  saring(f, d) { ke('#/laporan' + qs(Object.fromEntries(d))); },
  'saring-katalog'(f, d) { ke('#/katalog' + qs(Object.fromEntries(d))); },
  'saring-ahsp'(f, d) { ke('#/ahsp' + qs(Object.fromEntries(d))); },
  'saring-cetak'(f, d) { ke('#/cetak' + qs(Object.fromEntries(d))); },
  bersihkan(f, d) {
    const mode = d.get('cakupan');
    const ids = mode === 'terpilih' ? [...document.querySelectorAll('.pilih-laporan:checked')].map(c => Number(c.value))
      : db.laporan.filter(l => mode === 'semua' || l.status === mode).map(l => l.id);
    const info = document.getElementById('info-pilih');
    if (!ids.length) { info.textContent = mode === 'terpilih' ? 'Belum ada laporan yang dicentang.' : 'Tidak ada laporan pada kelompok ini.'; return; }
    if (!d.get('yakin')) { info.textContent = 'Centang pernyataan bahwa laporan yang dibersihkan tidak dapat dikembalikan.'; return; }
    if (!confirm('Bersihkan ' + ids.length + ' laporan? Laporan beserta perintah kerja, riwayat, dan fotonya akan dihapus permanen.')) return;
    return jalankan(f, async () => {
      const r = await api('bersihkan', {cakupan: mode, id: ids});
      await selesaiAksi('#/laporan', r.jumlah + ' laporan dibersihkan beserta perintah kerja, riwayat, dan fotonya.');
    }, 'Membersihkan…');
  },
  'buat-pk'(f, d) {
    return jalankan(f, async () => {
      const r = await api('buatPk', {id: f.dataset.id, teknisi: d.get('teknisi'), target: d.get('target'), catatan: d.get('catatan')});
      await selesaiAksi('#/laporan/' + f.dataset.id, r.pesan);
    });
  },
  'ubah-pk'(f, d) {
    const pk = pkId(f.dataset.id);
    return jalankan(f, async () => {
      const r = await api('ubahPk', {id: pk.id, teknisi: d.get('teknisi'), target: d.get('target'), catatan: d.get('catatan')});
      await selesaiAksi('#/laporan/' + pk.lap, r.pesan);
    });
  },
  tolak(f, d) {
    return jalankan(f, async () => {
      const r = await api('tolak', {id: f.dataset.id, alasan: d.get('alasan')});
      await selesaiAksi('#/laporan/' + f.dataset.id, r.pesan);
    });
  },
  'selesai-pk'(f, d) {
    if (!(d.get('tindakan') || '').trim()) return galatForm(f, 'Tuliskan tindakan perbaikan yang dilakukan.');
    const berkas = f.querySelector('#foto').files;
    return jalankan(f, async () => {
      const foto = await kecilkanFoto(berkas);
      const r = await api('selesai', {id: f.dataset.id, tindakan: d.get('tindakan'), penyebab: d.get('penyebab'), biaya: d.get('biaya'), foto});
      await selesaiAksi('#/perintah/' + f.dataset.id, r.pesan);
    }, berkas.length ? 'Mengunggah foto…' : 'Menyimpan…');
  },
  'tambah-pengguna'(f, d) {
    return jalankan(f, async () => {
      const r = await api('simpanPengguna', {baru: true, u: d.get('u'), nama: d.get('nama'), peran: d.get('peran'), sandi: d.get('sandi')});
      await selesaiAksi('#/pengguna', r.pesan);
    });
  },
  'ganti-sandi'(f, d) {
    if (d.get('baru') !== d.get('ulang')) return galatForm(f, 'Ulangan kata sandi baru tidak sama.');
    return jalankan(f, async () => { const r = await api('gantiSandi', {lama: d.get('lama'), baru: d.get('baru')}); ke('#/dasbor', r.pesan); });
  },
};
const AKSI_KLIK = {
  keluar() { sesi.set(null); db = null; ke('#/masuk', 'Anda sudah keluar.'); },
  ulang() { render({segarkan: true}); },
  segarkan(b) { jalankan(b, async () => { await muatData(); db.waktu = Date.now(); ke(location.hash || '#/dasbor', 'Data dimuat ulang.'); }, 'Memuat…'); },
  lupakan(b) { saya.hapus(b.dataset.kode); const w = document.getElementById('wadah-saya'); if (w) w.innerHTML = laporanSaya(); },
  gulir() { document.getElementById('formulir-laporan').scrollIntoView({behavior: 'smooth'}); },
  cetak() { window.print(); },
  verifikasi(b) { jalankan(b, async () => { const r = await api('verifikasi', {id: b.dataset.id}); await selesaiAksi('#/laporan/' + b.dataset.id, r.pesan); }); },
  mulai(b) { jalankan(b, async () => { const r = await api('mulai', {id: b.dataset.id}); await selesaiAksi('#/perintah/' + b.dataset.id, r.pesan); }); },
  'batal-pk'(b) {
    const pk = pkId(b.dataset.id);
    if (!confirm('Batalkan perintah kerja ' + pk.kode + '? Laporan kembali ke antrean dan dapat ditugaskan ulang.')) return;
    jalankan(b, async () => { const r = await api('batalPk', {id: pk.id}); await selesaiAksi('#/laporan/' + pk.lap, r.pesan); });
  },
  'atur-sandi'(b) {
    const sandi = prompt('Kata sandi baru untuk ' + b.dataset.u + ' (paling sedikit 8 karakter):');
    if (sandi === null) return;
    if (sandi.length < 8) return alert('Kata sandi paling sedikit 8 karakter.');
    jalankan(b, async () => { const r = await api('simpanPengguna', {u: b.dataset.u, sandi}); await selesaiAksi('#/pengguna', r.pesan + ' Sampaikan kata sandi baru kepada pemilik akun.'); });
  },
  aktif(b) {
    const ya = b.dataset.aktif === '1';
    if (!ya && !confirm('Nonaktifkan akun ' + b.dataset.u + '? Akun ini tidak dapat masuk sampai diaktifkan lagi.')) return;
    jalankan(b, async () => { const r = await api('simpanPengguna', {u: b.dataset.u, aktif: ya}); await selesaiAksi('#/pengguna', r.pesan); });
  },
};

document.addEventListener('submit', e => {
  const f = e.target, a = f.dataset.aksi;
  if (!a || !AKSI[a]) return;
  e.preventDefault();
  if (f.querySelector('button[disabled]')) return;
  AKSI[a](f, new FormData(f));
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-aksi-klik]');
  if (!b || !AKSI_KLIK[b.dataset.aksiKlik]) return;
  e.preventDefault();
  if (b.disabled) return;
  AKSI_KLIK[b.dataset.aksiKlik](b);
});
window.addEventListener('hashchange', () => render());
render();
})();

</script>
